[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gerber-comparator"
version = "0.1.0"
description = "Vector-geometry Gerber comparison engine"
requires-python = ">=3.10"
dependencies = ["shapely>=2.0", "matplotlib>=3.7"]

[project.scripts]
gerber-compare = "gerber_comparator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
